[project]
name = "tooling"
version = "0.0.0"
description = "Repository tooling for slidev-tmpl (pre-commit hooks, scripts)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pre-commit>=4.6.2"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.rumdl.MD013]
line-length = 0
reflow = true
reflow-mode = "sentence-per-line"
