default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # rumdl reflows prose sentence-per-line and rejects repeated top-level
  # headings; both corrupt a deck. Prose docs only.
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.78
    hooks:
      - id: rumdl-fmt
        files: ^(README\.md|AGENTS\.md|docs/.*\.md)$
      - id: rumdl-check
        files: ^(README\.md|AGENTS\.md|docs/.*\.md)$

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [vue, ts, javascript, json, yaml, css]

      - id: prettier-slides
        name: prettier (slidev)
        entry: pnpm exec prettier --write
        language: system
        files: ^decks/.*\.md$

      # zhtw-mcp is installed outside this repository and must be on PATH.
      # A plain lint exits 0 even with warnings, so the gate is explicit.
      - id: zhtw
        name: zhtw-mcp (zh-TW prose)
        entry: zhtw-mcp lint --content-type markdown --max-warnings 0
        language: system
        files: ^docs/.*\.md$

      # A deck marks a named slot with ::name::, which the colon rule reads
      # as a Chinese sentence wanting a full-width colon.
      - id: zhtw-deck
        name: zhtw-mcp (zh-TW prose, deck)
        entry: zhtw-mcp lint --content-type markdown --off colon --max-warnings 0
        language: system
        files: ^decks/.*\.md$

      # The tracked-sources check can only fail where an untracked file is on
      # disk, which is here and not in CI.
      - id: site-check
        name: site invariants
        entry: node site/check.mjs
        language: system
        pass_filenames: false
        files: ^(site/|scripts/|\.gitignore$)

      - id: check-commit-msg
        name: check commit message
        entry: uv run scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
