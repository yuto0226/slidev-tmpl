name: publish

on:
  push:
    branches: [main]
    paths: ['themes/flourish/**']
  workflow_dispatch:

# npm mints a short-lived registry credential from the id-token, and the tag is
# written back after a release lands.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: themes/flourish
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      # setup-node's registry-url would set NODE_AUTH_TOKEN and take the publish
      # off the OIDC path, so the registry is left to npm's default.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm 11.5.1, and the node image ships an older one.
      - run: npm install -g npm@latest
        working-directory: .

      - run: pnpm install --frozen-lockfile
        working-directory: .

      # The version in the manifest is the release trigger. A package that is not
      # published yet has no version to compare against.
      - id: version
        run: |
          local="$(node -p "require('./package.json').version")"
          remote="$(npm view "$(node -p "require('./package.json').name")" version 2>/dev/null || true)"
          echo "number=$local" >> "$GITHUB_OUTPUT"
          echo "release=$([ "$local" != "$remote" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "manifest $local, registry ${remote:-none}" >> "$GITHUB_STEP_SUMMARY"

      - if: steps.version.outputs.release == 'yes'
        run: pnpm typecheck
        working-directory: .

      - if: steps.version.outputs.release == 'yes'
        run: pnpm lint
        working-directory: .

      # prepack builds the fonts from fonts.toml, so the tarball cannot ship a stale set.
      - if: steps.version.outputs.release == 'yes'
        run: npm publish --provenance --access public

      - if: steps.version.outputs.release == 'yes'
        run: |
          tag="flourish-v${{ steps.version.outputs.number }}"
          git tag "$tag"
          git push origin "$tag"
